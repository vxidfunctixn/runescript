<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuneScript — podgląd</title>
  <style>
    /* Fonty NIE są ładowane przez @font-face — rejestruje je skrypt na dole
       z danych wklejonych w stronę przez build_font.py (patrz <script>). */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a1a;
      --bg-soft: #171717;
      --line: #2b2b2b;
      --fg: #e0e0e0;
      --fg-dim: #7a7a7a;
      --accent: #d8b26a;
      --thumb: #3a3a3a;
      --thumb-hover: #4e4e4e;

      /* szerokość kciuka suwaka — znaczniki masterów wcinają się o jej połowę,
         żeby skrajne wypadały dokładnie pod kciukiem */
      --thumb-size: 16px;

      /* proporcje panelu — nadpisywane z localStorage przez skrypt */
      --panel-w: 350px;   /* trzymaj zgodnie z PANEL_W_DEFAULT w skrypcie */
      --composer-h: 33.333vh;
    }

    /* --- scrollbary ------------------------------------------------------- */
    /* Firefox (standard) */
    * { scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; }

    /* WebKit/Blink — nie czyta powyższych właściwości */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--thumb);
      border-radius: 6px;
      /* przezroczysta ramka zwęża uchwyt, zostawiając margines od krawędzi */
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--thumb-hover);
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-corner { background: transparent; }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* --- sekcja tekstowa (wysokość regulowana uchwytem) -------------------- */
    .composer {
      flex: 0 0 var(--composer-h);
      display: flex;
      min-height: 0;
    }

    /* --- uchwyty zmiany proporcji ------------------------------------------ */
    .gutter {
      flex: 0 0 7px;
      position: relative;
      background: var(--bg-soft);
      touch-action: none;   /* nie oddawaj gestu przewijaniu strony */
    }
    .gutter::before {
      content: "";
      position: absolute;
      background: var(--line);
    }
    .gutter-x { cursor: col-resize; }
    .gutter-y { cursor: row-resize; }
    .gutter-x::before { top: 0; bottom: 0; left: 3px; width: 1px; }
    .gutter-y::before { left: 0; right: 0; top: 3px; height: 1px; }
    .gutter:hover::before, .gutter.active::before { background: var(--accent); }
    .gutter-x:hover::before, .gutter-x.active::before { left: 2px; width: 3px; }
    .gutter-y:hover::before, .gutter-y.active::before { top: 2px; height: 3px; }

    /* w trakcie ciągnięcia nie zaznaczaj tekstu i utrzymaj kursor uchwytu */
    body.dragging { user-select: none; }
    body.dragging-x, body.dragging-x * { cursor: col-resize !important; }
    body.dragging-y, body.dragging-y * { cursor: row-resize !important; }

    .composer textarea {
      flex: 1 1 auto;
      min-width: 0;
      padding: 1.25rem;
      border: none;
      outline: none;
      resize: none;
      background: var(--bg);
      color: var(--fg);
      font-size: 42px;
      line-height: 1;
      caret-color: var(--fg);
    }
    .composer textarea::placeholder { color: #555; }

    /* --- panel sterowania po prawej stronie inputa ------------------------- */
    .switcher {
      flex: 0 0 auto;
      width: var(--panel-w);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      padding: 0.9rem;
      background: var(--bg-soft);
      overflow-y: auto;
    }
    .switcher .group { display: flex; flex-direction: column; gap: 4px; }
    .switcher .label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-dim);
      padding: 0 0.15rem 0.25rem;
      user-select: none;
    }
    .switcher .label b {
      font-weight: 600;
      letter-spacing: 0;
      color: var(--accent);
    }

    .switcher button {
      appearance: none;
      text-align: left;
      white-space: nowrap;
      padding: 0.45rem 0.8rem;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--fg-dim);
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .switcher button:hover { color: var(--fg); background: #202020; }
    .switcher button[aria-pressed="true"] {
      color: var(--accent);
      border-color: #3a3227;
      background: #221d15;
    }

    /* czcionki: siatka 2x2; grid-auto-rows wyrównuje wysokość obu wierszy,
       mimo że „RuneScript Monospace" łamie się na dwie linie */
    .switcher .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
      gap: 4px;
    }
    .switcher .grid2 button {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: normal;
      line-height: 1.25;
      padding: 0.5rem 0.4rem;
    }

    /* suwaki — skokowe, wartości z list SIZES / LINE_HEIGHTS / LETTER_SPACINGS */
    .switcher input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    /* skala masterów pod suwakiem wagi — znaczniki stoją tam, gdzie wypada ich
       grubość obrysu w zakresie od najcieńszego do najgrubszego mastera */
    .switcher .masters {
      position: relative;
      height: 26px;
      margin-top: 2px;
      user-select: none;
    }
    .switcher .masters button {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      padding: 0;
      border: none;
      background: none;
      font-size: 0.6rem;
      line-height: 1;
      color: #5a5a5a;
      white-space: nowrap;
      cursor: pointer;
    }
    .switcher .masters button::before {
      content: "";
      display: block;
      width: 1px;
      height: 4px;
      margin: 0 auto 3px;
      background: #4a4a4a;
    }
    .switcher .masters button:hover { color: var(--fg); background: none; }
    .switcher .masters button:hover::before { background: var(--fg); }
    .switcher .masters button.current { color: var(--accent); }
    .switcher .masters button.current::before { background: var(--accent); height: 6px; }

    /* grupa nieaktywna (suwak wagi przy czcionce bez osi) */
    .switcher .group.disabled { opacity: 0.35; }
    .switcher .group.disabled input[type="range"] { cursor: not-allowed; }

    .switcher .ticks {
      display: flex;
      justify-content: space-between;
      padding: 0 0.1rem;
      font-size: 0.6rem;
      color: #5a5a5a;
      user-select: none;
    }

    /* --- grid znaków ------------------------------------------------------- */
    .sheet { flex: 1 1 auto; overflow-y: auto; padding: 1rem; min-height: 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 0.6rem;
    }

    .cell {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-soft);
      overflow: hidden;
    }

    /* wiersz 1: znak — po lewej runa, po prawej Arial 50% */
    .cell .glyphs { display: flex; }
    .cell .glyphs > div {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 84px;
      font-size: 44px;
      line-height: 1;
    }
    .cell .rune  { font-family: "RuneScript", monospace; color: var(--fg); }
    .cell .plain {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      opacity: 0.5;
      border-left: 1px solid var(--line);
    }

    /* wiersz 2: podpis */
    .cell .caption {
      border-top: 1px solid var(--line);
      padding: 0.4rem 0.5rem;
      text-align: center;
      font-size: 0.68rem;
      color: var(--fg-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sheet .empty { color: var(--fg-dim); font-size: 0.85rem; }
  </style>
</head>
<body>
  <section class="composer">
    <textarea id="input" spellcheck="false" autofocus placeholder="Wpisz tekst…"></textarea>
    <div class="gutter gutter-x" id="gutter-x" role="separator" aria-orientation="vertical"
         title="Przeciągnij, aby zmienić szerokość panelu"></div>
    <nav class="switcher" aria-label="Ustawienia podglądu">
      <div class="group">
        <span class="label">Czcionka</span>
        <div class="grid2" id="font-options"></div>
      </div>

      <!-- suwaki buduje skrypt (patrz slider()) — markup każdego jest identyczny -->
      <div class="group" id="weight-slider"></div>
      <div class="group" id="size-slider"></div>
      <div class="group" id="lh-slider"></div>
      <div class="group" id="ls-slider"></div>
    </nav>
  </section>

  <div class="gutter gutter-y" id="gutter-y" role="separator" aria-orientation="horizontal"
       title="Przeciągnij, aby zmienić wysokość sekcji tekstowej"></div>

  <section class="sheet">
    <div class="grid" id="grid"><p class="empty">Wczytywanie znaków…</p></div>
  </section>

  <script>
    // Ten plik jest tylko szablonem — gotową stronę (docs/index.html) składa
    // build_font.py, wstrzykując tu fonty i listę znaków. Bez tego nie ma czego
    // pokazać, bo nic nie jest pobierane w runtime.
    const EMBED = window.__RUNESCRIPT_EMBED__ || null;

    // --- regulowane proporcje panelu (zapisywane w localStorage) -------------
    const LAYOUT_KEY = "runescript.layout";
    const PANEL_W_DEFAULT = 350;   // px; odpowiednik --panel-w w CSS
    const layout = { panelW: PANEL_W_DEFAULT, composerH: Math.round(innerHeight / 3) };
    try {
      Object.assign(layout, JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {});
    } catch { /* uszkodzony wpis — zostają wartości domyślne */ }

    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));

    function applyLayout() {
      // klamrowanie przy każdym zastosowaniu, więc zmiana rozmiaru okna
      // nie może zepchnąć panelu ani sekcji tekstowej poza ekran
      layout.panelW = clamp(layout.panelW, 200, innerWidth - 260);
      layout.composerH = clamp(layout.composerH, 90, innerHeight - 140);
      const s = document.documentElement.style;
      s.setProperty("--panel-w", layout.panelW + "px");
      s.setProperty("--composer-h", layout.composerH + "px");
    }
    const saveLayout = () => localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));

    /** Wiąże uchwyt z wymiarem: onDrag przelicza pozycję kursora na nowy rozmiar. */
    function resizable(gutter, axis, onDrag) {
      gutter.addEventListener("pointerdown", e => {
        e.preventDefault();
        gutter.setPointerCapture(e.pointerId);
        gutter.classList.add("active");
        document.body.classList.add("dragging", "dragging-" + axis);

        const move = ev => { onDrag(ev); applyLayout(); };
        const up = ev => {
          gutter.releasePointerCapture(ev.pointerId);
          gutter.classList.remove("active");
          document.body.classList.remove("dragging", "dragging-" + axis);
          gutter.removeEventListener("pointermove", move);
          gutter.removeEventListener("pointerup", up);
          gutter.removeEventListener("pointercancel", up);
          saveLayout();
        };
        gutter.addEventListener("pointermove", move);
        gutter.addEventListener("pointerup", up);
        gutter.addEventListener("pointercancel", up);
      });
      // dwuklik przywraca domyślną proporcję tego wymiaru
      gutter.addEventListener("dblclick", () => {
        if (axis === "x") layout.panelW = PANEL_W_DEFAULT;
        else layout.composerH = Math.round(innerHeight / 3);
        applyLayout();
        saveLayout();
      });
    }

    // panel przylega do prawej krawędzi, sekcja tekstowa do górnej
    resizable(document.getElementById("gutter-x"), "x",
              e => { layout.panelW = innerWidth - e.clientX; });
    resizable(document.getElementById("gutter-y"), "y",
              e => { layout.composerH = e.clientY; });

    addEventListener("resize", applyLayout);
    applyLayout();

    // --- fonty wklejone w stronę jako data: URL (patrz write_static_page) ------
    // Wariant variable dostaje deskryptor wagi 300..700 — bez niego przeglądarka
    // przycięłaby oś do domyślnego 400 i suwak nic by nie zmieniał.
    [["RuneScript", "runescript.ttf", {}],
     ["RuneScript Monospace", "runescript-monospace.ttf", {}],
     ["RuneScript Variable", "runescript-variable.ttf", { weight: "100 900" }],
     ["RuneScript Mono Variable", "runescript-monospace-variable.ttf", { weight: "100 900" }],
    ].forEach(([family, file, desc]) => {
      new FontFace(family, `url(${EMBED ? EMBED.fonts[file] : ""}) format("truetype")`, desc)
        .load()
        .then(f => document.fonts.add(f))
        .catch(err => console.error("Nie udało się wczytać fontu", family, err));
    });

    // --- panel sterowania podglądem -----------------------------------------
    // variable: true włącza suwak wagi (font-variation-settings) dla tej pozycji
    const FONTS = [
      ["Arial",       { stack: 'Arial, Helvetica, sans-serif' }],
      ["Consolas",    { stack: 'Consolas, "Courier New", monospace' }],
      ["RuneScript",  { stack: '"RuneScript", monospace' }],
      ["RS Monospace", { stack: '"RuneScript Monospace", monospace' }],
      ["RS Variable", { stack: '"RuneScript Variable", monospace', variable: true }],
      ["RS Mono Var", { stack: '"RuneScript Mono Variable", monospace', variable: true }],
    ];
    const WEIGHT_RANGE = { min: 100, max: 900, default: 400 };
    // wartości suwaków — suwak indeksuje listę, więc nie ustawia wartości pośrednich
    const SIZES = [12, 16, 24, 42, 64];        // px
    const LINE_HEIGHTS = [1, 1.2, 1.35, 1.5];
    // 0 = sam odstęp wbudowany w czcionkę (LETTER_SPACE_PX w build_font.py);
    // pozostałe wartości dokładają światło ponad to. W em, więc skalują się z rozmiarem.
    const LETTER_SPACINGS = [0, 0.1, 0.2, 0.35, 0.5];

    const input = document.getElementById("input");

    /** Grupa przycisków działających jak radio — zwraca funkcję ustawiającą wybór. */
    function buttonGroup(container, items, apply) {
      const buttons = items.map(([label, value]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", () => select(b, value));
        container.appendChild(b);
        return b;
      });
      function select(chosen, value) {
        apply(value);
        buttons.forEach(b => b.setAttribute("aria-pressed", String(b === chosen)));
      }
      return index => select(buttons[index], items[index][1]);
    }

    const selectFont = buttonGroup(
      document.getElementById("font-options"), FONTS,
      font => {
        input.style.fontFamily = font.stack;
        setWeightEnabled(!!font.variable);
      });

    // --- suwak wagi: oś wght fontu variable ---------------------------------
    // Suwak jest wyskalowany GRUBOŚCIĄ KRESKI, nie wartością wght. Dzięki temu
    // pozycja znacznika 400 to dokładnie ta pozycja, na której font rysuje kreskę
    // 1.0px — czyli tyle, ile ma referencyjny plik SVG tej wagi. Przy skali
    // liniowej względem wght tak by nie było, bo przyrost grubości nie jest
    // liniowy względem wagi (400->500 to +0.2px, ale 700->900 tylko +0.3px).
    //
    // Przeliczenie jest dokładne: font interpoluje współrzędne liniowo względem
    // wght, więc między dwoma masterami grubość też jest liniowa względem wght.
    // Odwzorowanie pozycja -> grubość -> wght trafia zatem w żądaną grubość
    // co do jednostki, a nie w przybliżeniu.
    const MASTERS = (EMBED && EMBED.masters || [])
      .filter(m => m.strokeWidth != null)
      .sort((a, b) => a.strokeWidth - b.strokeWidth);
    const HAS_MASTERS = MASTERS.length > 1;
    const SW_MIN = HAS_MASTERS ? MASTERS[0].strokeWidth : 0;
    const SW_MAX = HAS_MASTERS ? MASTERS[MASTERS.length - 1].strokeWidth : 1;
    const STEPS = 1000;   // rozdzielczość suwaka (pozycja 0..STEPS)

    const posToWidth = pos => SW_MIN + (pos / STEPS) * (SW_MAX - SW_MIN);
    const widthToPos = sw => Math.round((sw - SW_MIN) / (SW_MAX - SW_MIN) * STEPS);

    // Pozycja suwaka jest liczbą całkowitą, więc rzadko wypada IDEALNIE na grubości
    // mastera (np. 400 wychodziłoby jako 400.3). Na pozycjach masterów bierzemy
    // więc wartości wprost z pliku, zamiast je odtwarzać z pozycji — tylko wtedy
    // znacznik 400 daje kreskę co do jednostki taką jak referencyjny SVG.
    const SNAP = new Map(MASTERS.map(m => [widthToPos(m.strokeWidth), m]));

    /** Grubość -> wght, liniowo między sąsiednimi masterami. */
    function widthToWeight(sw) {
      if (!HAS_MASTERS) return WEIGHT_RANGE.default;
      for (let i = 1; i < MASTERS.length; i++) {
        const a = MASTERS[i - 1], b = MASTERS[i];
        if (sw <= b.strokeWidth || i === MASTERS.length - 1) {
          const t = (sw - a.strokeWidth) / (b.strokeWidth - a.strokeWidth);
          return a.weight + t * (b.weight - a.weight);
        }
      }
      return MASTERS[0].weight;
    }

    const weightGroup = document.getElementById("weight-slider");
    const weightReadout = document.createElement("b");
    const weightCaption = document.createElement("span");
    weightCaption.className = "label";
    weightCaption.append("Waga (wght) ", weightReadout);

    const weightRange = document.createElement("input");
    weightRange.type = "range";
    weightRange.min = "0";
    weightRange.max = String(STEPS);
    weightRange.step = "1";
    weightRange.setAttribute("aria-label", "Waga czcionki");

    // po jednym znaczniku na master; pozycja = jego grubość na skali suwaka
    const weightMasters = document.createElement("div");
    weightMasters.className = "masters";
    const masterButtons = MASTERS.map(m => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = m.weight;
      b.title = `${m.style} — wght ${m.weight}, kreska ${m.strokeWidth}px (jak w SVG)`;
      b.style.left = trackOffset(widthToPos(m.strokeWidth) / STEPS);
      b.addEventListener("click", () => {
        weightRange.value = String(widthToPos(m.strokeWidth));
        applyWeight();
      });
      weightMasters.appendChild(b);
      return b;
    });

    /** Środek kciuka nie sięga krawędzi toru — wcinamy znaczniki o jego połowę,
     *  inaczej skrajne mastery wypadałyby obok kciuka zamiast pod nim. */
    function trackOffset(frac) {
      return `calc(var(--thumb-size) / 2 + (100% - var(--thumb-size)) * ${frac})`;
    }

    weightGroup.append(weightCaption, weightRange, weightMasters);

    function applyWeight() {
      const pos = Number(weightRange.value);
      const master = SNAP.get(pos) || null;
      const sw = master ? master.strokeWidth : posToWidth(pos);
      const wght = master ? master.weight : widthToWeight(sw);

      weightReadout.textContent = HAS_MASTERS
        ? `${Math.round(wght)} · ${sw.toFixed(2)}px`
        : Math.round(wght);
      input.style.fontVariationSettings = `"wght" ${wght.toFixed(1)}`;
      masterButtons.forEach((b, i) => b.classList.toggle("current", MASTERS[i] === master));
    }
    weightRange.addEventListener("input", applyWeight);

    // start na wadze domyślnej — czyli dokładnie na grubości z plików SVG
    const startMaster = MASTERS.find(m => m.weight === WEIGHT_RANGE.default);
    weightRange.value = String(startMaster ? widthToPos(startMaster.strokeWidth)
                                           : Math.round(STEPS / 2));

    function setWeightEnabled(on) {
      weightRange.disabled = !on;
      weightGroup.classList.toggle("disabled", !on);
    }

    /** Suwak skokowy po liście wartości. `label` opisuje wartość pod odczytem
     *  i podziałką, `tick` (opcjonalnie) skraca ją do podziałki. */
    function slider(container, title, values, { apply, label, tick, start = 0 }) {
      const short = tick || label;

      const readout = document.createElement("b");
      const caption = document.createElement("span");
      caption.className = "label";
      caption.append(title + " ", readout);

      const range = document.createElement("input");
      range.type = "range";
      range.min = "0";
      range.max = String(values.length - 1);
      range.step = "1";
      range.value = String(start);
      range.setAttribute("aria-label", title);

      const ticks = document.createElement("div");
      ticks.className = "ticks";
      ticks.append(...values.map(v =>
        Object.assign(document.createElement("span"), { textContent: short(v) })));

      container.append(caption, range, ticks);

      function update() {
        const v = values[Number(range.value)];
        readout.textContent = label(v);
        apply(v);
      }
      range.addEventListener("input", update);
      update();
    }

    slider(document.getElementById("size-slider"), "Rozmiar", SIZES, {
      start: SIZES.indexOf(42),
      label: px => px + " px",
      tick: px => String(px),
      apply: px => { input.style.fontSize = px + "px"; },
    });

    slider(document.getElementById("lh-slider"), "Interlinia", LINE_HEIGHTS, {
      label: lh => String(lh),
      apply: lh => { input.style.lineHeight = String(lh); },
    });

    slider(document.getElementById("ls-slider"), "Odstęp znaków", LETTER_SPACINGS, {
      label: ls => ls + " em",
      tick: ls => (ls ? String(ls) : "0"),
      apply: ls => { input.style.letterSpacing = ls + "em"; },
    });

    // stan początkowy (suwaki ustawiają się same przy tworzeniu)
    applyWeight();
    selectFont(2);           // RuneScript Regular (wyłącza suwak wagi)

    // --- grid ze wszystkimi znakami czcionki --------------------------------
    if (EMBED) {
      const glyphs = EMBED.characters.glyphs;
      renderGrid(glyphs);
      input.value = glyphs.map(g => g.char).join("");
    } else {
      document.getElementById("grid").innerHTML =
        '<p class="empty">To jest szablon — otwórz <code>docs/index.html</code> ' +
        '(generuje je <code>python build_font.py</code>)</p>';
    }

    function renderGrid(glyphs) {
      const grid = document.getElementById("grid");
      grid.textContent = "";
      for (const g of glyphs) {
        const cp = "U+" + g.char.codePointAt(0).toString(16).toUpperCase().padStart(4, "0");
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.title = `${g.char}  ${cp}`;

        const row = document.createElement("div");
        row.className = "glyphs";
        for (const cls of ["rune", "plain"]) {
          const box = document.createElement("div");
          box.className = cls;
          box.textContent = g.char;
          row.appendChild(box);
        }

        const caption = document.createElement("div");
        caption.className = "caption";
        caption.textContent = g.name || cp;

        cell.append(row, caption);
        grid.appendChild(cell);
      }
    }
  </script>
</body>
</html>
